<rect class="n3" x="316.5" y="118" width="12" height="12" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="322.5" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Apple SD Gothic Neo','Malgun Gothic','Microsoft YaHei','Noto Sans CJK SC','Noto Sans Arabic','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" class="l3" fill="#ffffff" text-anchor="middle" >구독 가져오기</text>
