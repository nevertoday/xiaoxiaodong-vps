<rect width="640" height="176" fill="#111111"/>
<text x="28" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Apple SD Gothic Neo','Malgun Gothic','Microsoft YaHei','Noto Sans CJK SC','Noto Sans Arabic','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#ffffff" fill-opacity=".62" text-anchor="start" >초보자 OK · 단계마다 스크린샷 · 처음엔 약 1시간</text>
