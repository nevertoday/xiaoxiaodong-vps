<svg xmlns="http://www.w3.org/2000/svg" width="640" height="176" viewBox="0 0 640 176" role="img" aria-label="가이드를 따라 한 단계씩">
<title>가이드를 따라 한 단계씩</title>
<style>
.track{stroke-dasharray:358;animation:fill 7s linear infinite}
@keyframes fill{0%{stroke-dashoffset:358;opacity:1}62%{stroke-dashoffset:0}92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.arrow{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.shine{animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,62%{transform:translateX(-80px)}76%,100%{transform:translateX(228px)}}
.ok{animation:ok 7s ease infinite}
@keyframes ok{0%,62%{opacity:0}66%,92%{opacity:1}100%{opacity:0}}
.n0{animation:n0 7s steps(1,end) infinite}
@keyframes n0{0%{fill-opacity:0}0%{fill-opacity:1}92%{fill-opacity:1}100%{fill-opacity:0}}
.l0{animation:l0 7s ease infinite}
@keyframes l0{0%{opacity:.4}0%{opacity:.4}3%{opacity:1}92%{opacity:1}100%{opacity:.4}}
.n1{animation:n1 7s steps(1,end) infinite}
@keyframes n1{0%{fill-opacity:0}15.5%{fill-opacity:1}92%{fill-opacity:1}100%{fill-opacity:0}}
.l1{animation:l1 7s ease infinite}
@keyframes l1{0%{opacity:.4}15.4%{opacity:.4}18.5%{opacity:1}92%{opacity:1}100%{opacity:.4}}
.n2{animation:n2 7s steps(1,end) infinite}
@keyframes n2{0%{fill-opacity:0}31%{fill-opacity:1}92%{fill-opacity:1}100%{fill-opacity:0}}
.l2{animation:l2 7s ease infinite}
@keyframes l2{0%{opacity:.4}30.9%{opacity:.4}34%{opacity:1}92%{opacity:1}100%{opacity:.4}}
.n3{animation:n3 7s steps(1,end) infinite}
@keyframes n3{0%{fill-opacity:0}46.5%{fill-opacity:1}92%{fill-opacity:1}100%{fill-opacity:0}}
.l3{animation:l3 7s ease infinite}
@keyframes l3{0%{opacity:.4}46.4%{opacity:.4}49.5%{opacity:1}92%{opacity:1}100%{opacity:.4}}
.n4{animation:n4 7s steps(1,end) infinite}
@keyframes n4{0%{fill-opacity:0}62%{fill-opacity:1}92%{fill-opacity:1}100%{fill-opacity:0}}
.l4{animation:l4 7s ease infinite}
@keyframes l4{0%{opacity:.4}61.9%{opacity:.4}65%{opacity:1}92%{opacity:1}100%{opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><clipPath id="cc"><rect x="464" y="28" width="148" height="120"/></clipPath>
