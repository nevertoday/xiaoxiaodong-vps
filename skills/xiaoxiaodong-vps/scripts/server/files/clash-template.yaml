# 小小东 VPS — Clash / Mihomo 订阅模板（写入 3x-ui 的 subClashRules）
# 部署时替换：{{SERVER_IP}} {{REALITY_NAME}} {{TLS_NAME}}
mode: rule
ipv6: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  cache-algorithm: arc
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter:
  - '*.lan'
  - +.local
  - +.msftconnecttest.com
  - +.msftncsi.com
  fake-ip-range: 198.18.0.1/16
  ipv6: false
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    rule-set:cn-domain:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  prefer-h3: false
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  respect-rules: true
proxy-groups:
- name: AUTO-自动切换
  type: fallback
  proxies:
  - '{{REALITY_NAME}}'
  - '{{TLS_NAME}}'
  url: https://www.gstatic.com/generate_204
  interval: 300
  lazy: true
- name: PROXY-代理
  type: select
  proxies:
  - AUTO-自动切换
  - '{{REALITY_NAME}}'
  - '{{TLS_NAME}}'
  - DIRECT
- name: AI-人工智能
  type: select
  proxies:
  - AUTO-自动切换
  - '{{TLS_NAME}}'
  - '{{REALITY_NAME}}'
  - PROXY-代理
  - DIRECT
- name: TELEGRAM-电报
  type: select
  proxies:
  - PROXY-代理
  - AUTO-自动切换
  - '{{REALITY_NAME}}'
  - '{{TLS_NAME}}'
  - DIRECT
- name: GOOGLE-谷歌
  type: select
  proxies:
  - PROXY-代理
  - AUTO-自动切换
  - '{{REALITY_NAME}}'
  - '{{TLS_NAME}}'
  - DIRECT
- name: MEDIA-影音
  type: select
  proxies:
  - AUTO-自动切换
  - '{{TLS_NAME}}'
  - '{{REALITY_NAME}}'
  - PROXY-代理
  - DIRECT
- name: NETFLIX-奈飞
  type: select
  proxies:
  - MEDIA-影音
  - PROXY-代理
  - AUTO-自动切换
  - '{{REALITY_NAME}}'
  - '{{TLS_NAME}}'
  - DIRECT
- name: APPLE-苹果
  type: select
  proxies:
  - DIRECT
  - PROXY-代理
  - AUTO-自动切换
  - '{{REALITY_NAME}}'
  - '{{TLS_NAME}}'
- name: MICROSOFT-微软
  type: select
  proxies:
  - DIRECT
  - PROXY-代理
  - AUTO-自动切换
  - '{{REALITY_NAME}}'
  - '{{TLS_NAME}}'
- name: PROXY
  type: select
  proxies:
  - AUTO-自动切换
  - '{{TLS_NAME}}'
  - PROXY-代理
  - DIRECT
